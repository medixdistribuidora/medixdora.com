/* ---------- Hook: revelação suave ao rolar ---------- */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) { el.classList.add("in"); return; }
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      }),
      { threshold: 0.15 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function Reveal({ children, delay = 0, className = "" }) {
  const ref = useReveal();
  return (
    <div ref={ref} className={`reveal ${className}`} style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </div>
  );
}

function dentroDoBrasil(x, y) {
  let inside = false;
  for (let i = 0, j = BR_POLY.length - 1; i < BR_POLY.length; j = i++) {
    const [xi, yi] = BR_POLY[i], [xj, yj] = BR_POLY[j];
    if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function MapaBrasil() {
  const dots = [];
  for (let y = 3; y < 221; y += 5.5) {
    for (let x = 0; x < 222; x += 5.5) {
      if (dentroDoBrasil(x, y)) dots.push([x, y]);
    }
  }
  return (
    <svg viewBox="-8 -8 238 238" className="mapa" role="img"
      aria-label="Mapa do Brasil com pontos de entrega nas 27 capitais">
      {dots.map(([x, y], i) => (
        <circle key={i} cx={x} cy={y} r="1.9" className="mapa__grain" />
      ))}
      {BR_CIDADES.map(([x, y, d], i) => (
        <g key={`c${i}`}>
          <circle cx={x} cy={y} r="7" className="mapa__halo" style={{ animationDelay: `${d}ms` }} />
          <circle cx={x} cy={y} r="3.1" className="mapa__dot" />
        </g>
      ))}
    </svg>
  );
}

.folio{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.folio__n{font-family:var(--display);font-weight:600;font-size:.9rem;color:var(--violet)}
.folio__rule{flex:0 0 56px;height:1px;background:var(--hairline)}
.folio__label{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;opacity:.65}
.sec--why .folio__n{color:var(--lilac)}
.sec--why .folio__rule{background:rgba(249,247,253,.25)}

/* ---------- hero ---------- */
.hero{padding:140px 24px 0;max-width:1240px;margin:0 auto}
.hero__grid{display:grid;grid-template-columns:1.45fr 1fr;gap:56px;align-items:center}
.hero__title{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,5vw,4rem);
  line-height:1.08;letter-spacing:-.02em;margin:22px 0 26px;max-width:14em}
.hero__title em{color:var(--violet)}
.hero__sub{font-size:1.08rem;line-height:1.75;max-width:34em;opacity:.88}
.hero__actions{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:36px}
.hero__note{font-size:.8rem;letter-spacing:.05em;opacity:.6}

/* vitrine premium do produto */
.vitrine{position:relative;border-radius:24px;overflow:hidden;
  background:linear-gradient(160deg,#FFFFFF 0%,#F3EDFC 55%,#E2D6F8 100%);
  border:1px solid var(--hairline);padding:40px 32px 0;display:flex;
  flex-direction:column;align-items:center;min-height:380px}
.vitrine__glow{position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.22),transparent 65%);
  top:8%;left:50%;transform:translateX(-50%)}
.vitrine__img{position:relative;max-height:280px;width:auto;max-width:80%;object-fit:contain;
  filter:drop-shadow(0 24px 32px rgba(76,29,149,.25))}
.vitrine__caption{position:relative;width:calc(100% + 64px);margin:auto -32px 0;
  padding:14px 24px;text-align:center;background:rgba(76,29,149,.92);color:var(--ivory);
  font-size:.74rem;letter-spacing:.18em;text-transform:uppercase}

/* 1 · prova social */
.prova{margin-top:72px;border-top:1px solid var(--hairline);
  border-bottom:1px solid var(--hairline);display:grid;
  grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hairline)}
.prova__item{background:var(--ivory);padding:30px 24px;text-align:center;
  display:flex;flex-direction:column;gap:6px}
.prova__item strong{font-family:var(--display);font-weight:800;font-size:1.7rem;
  color:var(--violet);letter-spacing:-.01em}
.prova__item span{font-size:.85rem;opacity:.75;max-width:18em;margin:0 auto}
@media (max-width:880px){
  .hero{padding-top:115px}
  .hero__grid{grid-template-columns:1fr;gap:40px}
  .vitrine{min-height:320px}
  .prova{grid-template-columns:1fr}
}

/* ---------- seções ---------- */
.sec{padding:100px 24px}
.sec__inner{max-width:1240px;margin:0 auto}
.sec__title{font-family:var(--display);font-weight:700;
  font-size:clamp(1.8rem,3.6vw,2.8rem);line-height:1.15;letter-spacing:-.015em;max-width:18em}
.sec__title em{color:var(--violet)}
.sec__title--ivory{color:var(--ivory)}
.sec__title--ivory em{color:var(--lilac)}

/* 2 · por que comprar */
.sec--why{background:linear-gradient(180deg,#2B1B47 0%,var(--espresso) 100%);color:var(--ivory)}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:60px}
.why__card{background:var(--ivory);color:var(--ink);border:none;
  border-radius:18px;padding:32px 26px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 18px 40px rgba(20,8,40,.35);
  transition:transform .3s ease,box-shadow .3s ease}
.why__card:hover{transform:translateY(-5px);box-shadow:0 26px 52px rgba(20,8,40,.45);
  background:#fff}
.why__ico{color:var(--violet);display:block;line-height:0}
.why__h{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--wine)}
.why__t{font-size:.92rem;line-height:1.65;opacity:.8}
@media (max-width:980px){.why{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.why{grid-template-columns:1fr}}

/* 3 · produtos em destaque */
.sec--produtos{background:var(--ivory)}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:60px}
.prod{background:#fff;border:1px solid var(--hairline);border-radius:22px;
  overflow:hidden;display:flex;flex-direction:column}
.prod__media{background:linear-gradient(160deg,#F6F2FC,#E9E0F8);aspect-ratio:4/5;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.prod__media img{height:100%;width:100%;object-fit:contain;padding:22px}
.prod__media--cover img{object-fit:cover;padding:0;object-position:center top}
.prod__media--ph{color:var(--violet)}
.prod__body{padding:30px 30px 34px;display:flex;flex-direction:column;gap:14px}
.prod__body .cta{align-self:center;margin-top:6px}
.prod__h{font-family:var(--display);font-weight:700;font-size:1.3rem}
.prod__t{font-size:.95rem;line-height:1.7;opacity:.85}
@media (max-width:980px){.prods{grid-template-columns:1fr;max-width:520px;margin-left:auto;margin-right:auto}}

.prods__cta{display:flex;justify-content:center;margin-top:44px}

/* 9 · pronta entrega */
.sec--estoque{background:var(--ivory-deep)}
.estoque__head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}
.estoque__head .sec__title{margin:0 auto}
.sec--estoque .folio{justify-content:center}
.estoque__lead{font-size:1rem;line-height:1.78;opacity:.85;max-width:40em;margin:0 auto;
  display:flex;flex-direction:column;gap:16px}
.estoque{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:52px;
  max-width:640px;margin-left:auto;margin-right:auto}
.estoque__item{position:relative;background:#fff;border:1px solid var(--hairline);
  border-radius:18px;overflow:hidden;aspect-ratio:3/4}
.estoque__item img{width:100%;height:100%;object-fit:cover}
.estoque__item--ph{display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#FBF9FE,#EFE8FA);color:var(--violet)}
.tag{position:absolute;top:12px;left:12px;background:var(--violet);color:#fff;
  font-size:.62rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  padding:.45em .9em;border-radius:999px}
.ph{display:flex;flex-direction:column;align-items:center;gap:10px;
  font-size:.75rem;letter-spacing:.08em;opacity:.8;text-align:center;padding:16px}
@media (max-width:560px){.estoque{grid-template-columns:1fr;max-width:320px}}

/* 5 · logística */
.sec--logistica{background:var(--ivory)}
.logistica__grid{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:center}
.logistica__lead{margin-top:24px;font-size:1.02rem;line-height:1.75;opacity:.85;max-width:32em}
.logistica__list{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.logistica__list li{position:relative;padding-left:26px;font-size:.95rem;opacity:.85}
.logistica__list li::before{content:'';position:absolute;left:0;top:.45em;width:12px;
  height:12px;border-radius:50%;background:var(--lilac);
  box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.logistica__mapWrap{display:flex;justify-content:center}
.mapa{width:100%;max-width:420px;height:auto}
.mapa__dot{fill:var(--violet)}
.mapa__halo{fill:none;stroke:var(--violet);stroke-width:1.4;opacity:0;
  animation:pulse 2.6s ease-out infinite}
@keyframes pulse{
  0%{opacity:.7;transform:scale(.4);transform-origin:center;transform-box:fill-box}
  70%{opacity:0;transform:scale(1.6);transform-origin:center;transform-box:fill-box}
  100%{opacity:0}
}
@media (max-width:880px){.logistica__grid{grid-template-columns:1fr;gap:40px}}

/* processo */
.sec--processo{background:var(--ivory-deep)}
.steps{list-style:none;margin-top:60px;border-top:1px solid var(--hairline)}
.step li{display:grid;grid-template-columns:120px 1fr;gap:32px;
  padding:36px 0;border-bottom:1px solid var(--hairline);align-items:start}
.step__n{font-family:var(--display);font-weight:700;font-size:2.2rem;
  color:var(--violet);line-height:1}
.step__h{font-family:var(--display);font-weight:600;font-size:1.35rem;margin-bottom:8px}
.step__t{font-size:.98rem;line-height:1.7;opacity:.85;max-width:42em}
@media (max-width:640px){
  .step li{grid-template-columns:64px 1fr;gap:18px;padding:28px 0}
  .step__n{font-size:1.6rem}
}

/* 6 · depoimentos */
.sec--depo{background:var(--ivory)}
.depos{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:56px}
.depo{background:#fff;border:1px solid var(--hairline);border-radius:20px;
  padding:36px 34px;display:flex;flex-direction:column;gap:24px}
.depo__q{font-family:var(--display);font-weight:600;font-size:1.25rem;
  line-height:1.45;color:var(--wine)}
.depo__who{display:flex;align-items:center;gap:12px}
.depo__avatar{width:42px;height:42px;border-radius:50%;background:var(--lilac);
  color:var(--wine);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700}
.depo__nome{font-size:.9rem;font-weight:500;letter-spacing:.04em}
@media (max-width:760px){.depos{grid-template-columns:1fr}}

/* sobre */
.sec--sobre{background:var(--ivory-deep)}
.sobre__grid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:52px}
.sobre__main{display:flex;flex-direction:column;align-items:center}
.sobre__main .folio{justify-content:center}
.sobre__main .sec__title{margin:0 auto}
.sobre__plate{background:var(--espresso);color:var(--lilac);aspect-ratio:4/5;
  width:100%;max-width:380px;margin:0 auto;
  border-radius:22px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:32px;text-align:center}
.sobre__mono{font-family:var(--display);font-size:2.6rem;font-weight:800;letter-spacing:.14em}
.sobre__monoSub{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;opacity:.7}
.sobre__copy{margin-top:30px;display:flex;flex-direction:column;gap:20px;
  font-size:1.02rem;line-height:1.8;max-width:36em;text-align:center}
@media (max-width:880px){
  .sobre__plate{aspect-ratio:4/5;max-height:none}
}

/* 8 · CTA final */
.final{background:var(--espresso);color:var(--ivory);padding:130px 24px;text-align:center}
.final__inner{max-width:780px;margin:0 auto;display:flex;flex-direction:column;
  align-items:center;gap:26px}
.final__title{font-family:var(--display);font-weight:700;
  font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.1;letter-spacing:-.015em}
.final__title em{color:var(--lilac)}
.final__sub{font-size:1.05rem;line-height:1.75;opacity:.85;max-width:34em}
.final__actions{margin-top:8px}


/* mapa pontilhado */
.mapa__grain{fill:var(--lilac-map)}

/* logo giratória (sobre) */
.sobre__spin{display:flex;justify-content:center;perspective:700px;margin:0 auto 6px}
.sobre__spin svg{display:block;animation:spinY 7s linear infinite;transform-style:preserve-3d}
@keyframes spinY{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.sobre__spin svg{animation:none}}

/* contorno corporal no CTA final */
.final{position:relative;overflow:hidden}
.final__inner{position:relative;z-index:1}


/* vitrine fotográfica (hero) */
.vitrine--foto{padding:0;min-height:0;display:block}
.vitrine__fotoImg{width:100%;height:480px;object-fit:cover;object-position:center 30%;display:block}
.vitrine--foto .vitrine__caption{width:100%;margin:0}
@media (max-width:880px){.vitrine__fotoImg{height:380px}}

/* banner de textura (por que comprar) */
.why__banner{margin-top:26px;position:relative;border-radius:18px;overflow:hidden}
.why__banner img{width:100%;height:230px;object-fit:cover;display:block}
.why__banner span{position:absolute;left:26px;bottom:20px;font-family:var(--display);
  font-weight:700;font-size:clamp(1.05rem,2.4vw,1.45rem);color:#fff;
  text-shadow:0 2px 14px rgba(36,22,56,.55)}
@media (max-width:560px){.why__banner img{height:160px}}

/* footer */
.ftr{background:var(--espresso);color:var(--ivory);border-top:1px solid rgba(249,247,253,.14)}
.ftr__inner{max-width:1240px;margin:0 auto;padding:28px 24px;display:flex;
  justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:.76rem;letter-spacing:.08em;opacity:.7}
`;


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
